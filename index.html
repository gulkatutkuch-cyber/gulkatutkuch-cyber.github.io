<!doctype html>
<!--
  Страница ссылок «Поделиться»: https://gulkatutkuch-cyber.github.io/?w=<цех> | ?o=<заказ> | ?v=<вакансия>.
  На телефоне с приложением ссылка открывает приложение сразу (App Links, см. .well-known/assetlinks.json);
  без приложения — эта страница: данные из Supabase (только то, что открыто гостям) и кнопка «Открыть в приложении».
  Исходник — в закрытом репозитории NSW (site/), публикуется скриптом site/publish.py:
  https://kpfwgftvbkshnvwjbvri.supabase.co и sb_publishable_1iJVKOR9MCsFhJT7Xu7hQw_M7_BwYNu (публичный ключ, как в приложении) подставляются из env.json.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Швейная сеть КР</title>
<meta name="description" content="Цехи, заказы и вакансии швейной отрасли Кыргызстана">
<meta property="og:title" content="Швейная сеть КР">
<meta property="og:description" content="Цехи, заказы и вакансии швейной отрасли Кыргызстана">
<meta name="theme-color" content="#F98012">
<style>
  :root {
    --primary: #F98012; --on-primary: #fff; --bg: #F7F5F2; --surface: #fff;
    --text: #1F1B16; --muted: #6E655C; --border: #E6E0D8; --sand: #F4A460;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17140F; --surface: #221E18; --text: #F2EDE6; --muted: #B3A99E; --border: #3A342C; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--primary); color: var(--on-primary); padding: 14px 16px; font-weight: 600; font-size: 18px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; overflow-wrap: anywhere; }
  .card img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; display: block; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .row { margin: 6px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 1px solid var(--border); border-radius: 16px; padding: 2px 10px; font-size: 14px; }
  .badge { display: inline-block; background: var(--sand); color: #1F1B16; border-radius: 4px; padding: 0 6px; font-size: 13px; margin-left: 6px; vertical-align: middle; }
  .btn { display: block; text-align: center; text-decoration: none; border-radius: 24px; padding: 12px 16px; font-weight: 600; margin-top: 10px; }
  .btn.primary { background: var(--primary); color: var(--on-primary); }
  .btn.outline { border: 1px solid var(--primary); color: var(--primary); }
  .note { font-size: 14px; }
</style>
</head>
<body>
<header>Швейная сеть КР · Тигүү тармагы</header>
<main id="app"><div class="card muted">Загрузка…</div></main>
<script>
const SUPABASE_URL = 'https://kpfwgftvbkshnvwjbvri.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1iJVKOR9MCsFhJT7Xu7hQw_M7_BwYNu';
const PACKAGE = 'kg.nsw.nsw';

// Как specializationLabels и vacancyPositionLabels в приложении (lib/models/catalog.dart).
const SPECS = { 'трикотаж': 'Трикотаж', 'верхняя': 'Верхняя одежда', 'джинс': 'Джинс', 'спецодежда': 'Спецодежда',
  'детская': 'Детская одежда', 'школьная форма': 'Школьная форма', 'офисная': 'Офисная одежда',
  'спортивная': 'Спортивная одежда', 'бельё': 'Бельё', 'домашний текстиль': 'Домашний текстиль' };
const POSITIONS = { 'швея': 'Швея', 'закройщик': 'Закройщик', 'технолог': 'Технолог', 'конструктор': 'Конструктор',
  'утюжильщик': 'Утюжильщик', 'упаковщик': 'Упаковщик', 'контролёр ОТК': 'Контролёр ОТК', 'мастер цеха': 'Мастер цеха', 'другое': 'Другое' };

const app = document.getElementById('app');
const params = new URLSearchParams(location.search);
const UUID = /^[0-9a-f-]{36}$/i;

// Текст из базы — только как текст, не как HTML.
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else e.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null && c !== '') e.append(c);
  return e;
}
const label = (map, k) => map[k] || k;
const money = (n) => Number(n).toLocaleString('ru-RU') + ' сом';
const date = (s) => new Date(s + 'T00:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

async function rest(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: { apikey: SUPABASE_KEY } });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

// Открыть то же самое в приложении: схема nsw:// (запасной путь, если App Links не сработали).
function openAppButton(query) {
  const fallback = encodeURIComponent(location.href);
  return el('a', { class: 'btn primary', href: `intent://open?${query}#Intent;scheme=nsw;package=${PACKAGE};S.browser_fallback_url=${fallback};end` },
    'Открыть в приложении');
}

function show(...cards) { app.replaceChildren(...cards); }

function notFound(title) {
  show(el('div', { class: 'card' }, el('h1', {}, title),
    el('p', { class: 'muted' }, 'Возможно, его уже закрыли или ссылка неполная.')), about());
}

function about() {
  return el('div', { class: 'card note muted' },
    'Швейная сеть КР — приложение для цехов и заказчиков Кыргызстана: каталог цехов, заказы, отклики, вакансии. ',
    'Приложение для Android скоро появится в Google Play.');
}

async function workshop(id) {
  const [w] = await rest(`workshops?id=eq.${id}&select=name,city,address,description,specializations,photos,rating,reviews_count,verified,min_order`);
  if (!w) return notFound('Цех не найден');
  document.title = `${w.name} — Швейная сеть КР`;
  show(el('div', { class: 'card' },
      w.photos && w.photos[0] ? el('img', { src: w.photos[0], alt: '' }) : null,
      el('h1', {}, w.name, w.verified ? el('span', { class: 'badge' }, 'Проверен') : null),
      el('div', { class: 'muted' }, [w.city, w.address].filter(Boolean).join(', ')),
      w.reviews_count > 0 ? el('div', { class: 'row' }, `★ ${Number(w.rating).toFixed(1)} · отзывов: ${w.reviews_count}`) : null,
      w.min_order ? el('div', { class: 'row' }, `Минимальная партия: ${w.min_order} ед.`) : null,
      w.description ? el('p', {}, w.description) : null,
      el('div', { class: 'chips' }, (w.specializations || []).map((s) => el('span', { class: 'chip' }, label(SPECS, s)))),
      openAppButton(`w=${id}`),
      el('p', { class: 'note muted' }, 'Написать цеху можно в приложении после входа.')),
    about());
}

async function order(id) {
  const [o] = await rest(`orders?id=eq.${id}&select=title,description,category,quantity,budget_per_unit,deadline,material_by,photos,status`);
  if (!o) return notFound('Заказ не найден или уже в работе');
  document.title = `${o.title} — Швейная сеть КР`;
  show(el('div', { class: 'card' },
      o.photos && o.photos[0] ? el('img', { src: o.photos[0], alt: '' }) : null,
      el('h1', {}, o.title),
      el('div', { class: 'muted' }, label(SPECS, o.category)),
      el('div', { class: 'row' }, `Тираж: ${o.quantity} ед.`),
      o.budget_per_unit != null ? el('div', { class: 'row' }, `Бюджет: ${money(o.budget_per_unit)} за ед.`) : null,
      o.deadline ? el('div', { class: 'row' }, `Срок: до ${date(o.deadline)}`) : null,
      el('div', { class: 'row' }, o.material_by === 'workshop' ? 'Материал — цеха' : 'Материал — заказчика'),
      o.description ? el('p', {}, o.description) : null,
      openAppButton(`o=${id}`),
      el('p', { class: 'note muted' }, 'Откликнуться может цех с аккаунтом в приложении.')),
    about());
}

async function vacancy(id) {
  const [v] = await rest(`vacancies?id=eq.${id}&select=position,description,salary,schedule,contact_phone,workshop:workshops(name,city)`);
  if (!v) return notFound('Вакансия не найдена');
  const pos = label(POSITIONS, v.position);
  const w = v.workshop || {};
  document.title = `${pos} — Швейная сеть КР`;
  let digits = (v.contact_phone || '').replace(/\D/g, '');
  if (digits.startsWith('0')) digits = '996' + digits.slice(1);
  if (digits.length === 9) digits = '996' + digits;
  const text = encodeURIComponent(`Здравствуйте! Пишу по вакансии «${pos}» в «${w.name || ''}» (Швейная сеть КР).`);
  show(el('div', { class: 'card' },
      el('h1', {}, pos),
      el('div', { class: 'muted' }, [w.name, w.city].filter(Boolean).join(' · ')),
      v.salary ? el('div', { class: 'row' }, `Оплата: ${v.salary}`) : null,
      v.schedule ? el('div', { class: 'row' }, `График: ${v.schedule}`) : null,
      v.description ? el('p', {}, v.description) : null,
      digits ? el('a', { class: 'btn primary', href: `https://wa.me/${digits}?text=${text}` }, 'Написать в WhatsApp') : null,
      el('a', { class: 'btn outline', href: `intent://open?v=${id}#Intent;scheme=nsw;package=${PACKAGE};S.browser_fallback_url=${encodeURIComponent(location.href)};end` },
        'Открыть в приложении')),
    about());
}

(async () => {
  const [kind, id] = [['w', workshop], ['o', order], ['v', vacancy]].map(([k, f]) => [f, params.get(k)]).find(([, v]) => v) || [];
  try {
    if (id && UUID.test(id)) await kind(id);
    else show(el('div', { class: 'card' }, el('h1', {}, 'Швейная сеть КР'),
      el('p', {}, 'Цехи, заказы и вакансии швейной отрасли Кыргызстана в одном приложении.')), about());
  } catch (e) {
    show(el('div', { class: 'card' }, el('h1', {}, 'Не удалось загрузить'), el('p', { class: 'muted' }, 'Проверьте интернет и обновите страницу.')));
  }
})();
</script>
</body>
</html>
